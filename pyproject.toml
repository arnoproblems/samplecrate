[project]
name = "samplecrate"
version = "0.4.0"
description = "Browse, audition, filter and organize a sample library from the terminal"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "sounddevice>=0.5",
    "soundfile>=0.13",
    "textual>=8.0,<9",
]

[project.scripts]
crate = "samplecrate.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/samplecrate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
